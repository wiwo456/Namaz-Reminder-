<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1f5b43" />
    <meta name="description" content="Namaz Reminder PWA with design preview, implementation status, and phone install flow." />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon-192.svg" type="image/svg+xml" />
    <title>Namaz Reminder PWA</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <main class="app-shell">
        <section class="app-screen">
            <header class="app-header">
                <button id="menuButton" class="menu-button" type="button" aria-label="Open menu" aria-expanded="false">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
                <div id="menuDropdown" class="menu-dropdown hidden-panel" aria-hidden="true">
                    <button id="settingsMenuItem" class="menu-item" type="button">Settings</button>
                </div>
                <div class="app-title">
                    <p class="eyebrow">Namaz Reminder</p>
                    <h1>Prayer Times</h1>
                </div>
                <p id="todayLabel" class="header-date">Today</p>
            </header>

            <section class="view-screen">
                <section class="hero-card main-hero-card">
                    <p class="card-label">Next Prayer</p>
                    <h2 id="nextPrayerName">Waiting</h2>
                    <p id="nextPrayerTime" class="hero-time">--:--</p>
                    <p id="countdownText" class="hero-subtext">Load prayer times to start.</p>
                </section>

                <section class="panel prayer-panel">
                    <div class="section-heading">
                        <div>
                            <p class="card-label">Today</p>
                            <h3>Prayer Schedule</h3>
                        </div>
                        <p id="locationSummary" class="section-support">Waiting for location</p>
                    </div>

                    <div id="prayerList" class="prayer-list"></div>
                </section>
            </section>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
