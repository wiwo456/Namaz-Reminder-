<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1f5b43" />
    <meta name="description" content="My Namaz PWA with prayer times, countdowns, and installable phone app flow." />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/my-namaz-192.png" sizes="192x192" type="image/png" />
    <link rel="shortcut icon" href="icons/my-namaz-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="icons/my-namaz-192.png" sizes="192x192" />
    <title>My Namaz</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <main class="app-shell">
        <section class="app-screen">
            <header class="app-header">
                <button id="menuButton" class="menu-button" type="button" aria-label="Open menu" aria-expanded="false">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
                <div id="menuDropdown" class="menu-dropdown hidden-panel" aria-hidden="true">
                    <button id="settingsMenuItem" class="menu-item" type="button">Settings</button>
                </div>
                <div class="app-title">
                    <p class="eyebrow">My Namaz</p>
                    <h1>Prayer Times</h1>
                </div>
                <p id="todayLabel" class="header-date">Today</p>
            </header>

            <section class="view-screen">
                <section id="heroCard" class="hero-card main-hero-card" data-weather-theme="clear-day">
                    <div class="weather-scene" aria-hidden="true">
                        <div class="weather-sky-glow"></div>
                        <div class="weather-sun"></div>
                        <div class="weather-moon"></div>
                        <div class="weather-cloud weather-cloud-one"></div>
                        <div class="weather-cloud weather-cloud-two"></div>
                        <div class="weather-rain"></div>
                        <div class="weather-snow"></div>
                    </div>
                    <div class="hero-content">
                        <div class="hero-weather-row">
                            <div>
                                <p class="card-label">Next Prayer</p>
                                <h2 id="nextPrayerName">Waiting</h2>
                            </div>
                            <div class="weather-chip">
                                <p id="weatherTemp" class="weather-temp">--</p>
                                <p id="weatherStatus" class="weather-status">Loading weather</p>
                            </div>
                        </div>
                        <p id="nextPrayerTime" class="hero-time">--:--</p>
                        <p id="countdownText" class="hero-subtext">Load prayer times to start.</p>
                        <p id="weatherMeta" class="hero-weather-meta">Looking outside...</p>
                    </div>
                </section>

                <section class="panel prayer-panel">
                    <div class="section-heading">
                        <div>
                            <p class="card-label">Today</p>
                            <h3>Prayer Schedule</h3>
                        </div>
                        <p id="locationSummary" class="section-support">Waiting for location</p>
                    </div>

                    <div id="prayerList" class="prayer-list"></div>
                </section>

                <section class="panel masjid-panel">
                    <div class="section-heading">
                        <div>
                            <p class="card-label">Nearby</p>
                            <h3>Masjid Locations</h3>
                        </div>
                        <p id="masjidSummary" class="section-support">Checking nearby masjid</p>
                    </div>

                    <div id="masjidLocationCard" class="masjid-card">
                        <p id="masjidStatus" class="masjid-status">Waiting for location...</p>
                    </div>
                </section>
            </section>
        </section>
    </main>

    <script src="app.js?v=4"></script>
</body>
</html>
